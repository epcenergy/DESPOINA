<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Αποθήκη Τροφίμων</title>
<meta name="theme-color" content="#2f5d3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Αποθήκη">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--g:#2f5d3a;--g2:#3f7a4c;--bg:#f3f1ea;--card:#fff;--tx:#1f2420;--mut:#6b716c;--line:#e3e0d6;--red:#c0392b;--amb:#d68910;--blue:#2462a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px}
header{position:sticky;top:0;z-index:5;background:var(--g);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;margin-right:8px}
header .hv{font-size:13px;opacity:.9;text-align:right}
#hshare{border:0;background:rgba(255,255,255,.18);color:#fff;font-size:20px;width:42px;height:42px;border-radius:12px;margin-left:6px}
#banner .card{background:#fff4d6;border:1px solid #f0c75e;margin:12px 12px 0}
@media (max-width:400px){.h1x{display:none}}
header .hv b{font-size:16px;display:block}
main{padding:12px 12px calc(env(safe-area-inset-bottom) + 90px)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:8px 2px 7px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:21px;line-height:1}
nav button.on{color:var(--g);font-weight:700}
.card{background:var(--card);border-radius:14px;padding:12px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.row{display:flex;gap:8px;align-items:center}
.sp{flex:1}
.btn{border:0;border-radius:10px;padding:11px 14px;font-size:15px;font-weight:600;background:var(--g);color:#fff}
.btn.sec{background:#e8e5da;color:var(--tx)}
.btn.red{background:var(--red)}
.btn.blue{background:var(--blue)}
.btn.sm{padding:7px 10px;font-size:13px}
.btn.full{width:100%}
input,select,textarea{font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff;width:100%;color:var(--tx);font-family:inherit}
label{font-size:13px;color:var(--mut);display:block;margin:10px 0 4px}
.search{margin-bottom:10px}
.cat{margin-bottom:12px}
.cath{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;font-weight:700;color:var(--g)}
.cath small{color:var(--mut);font-weight:500}
.item{background:#fff;border-radius:12px;padding:10px;margin-bottom:6px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.item .info{flex:1;min-width:0}
.item .info b{display:block;font-size:15px}
.item .info small{color:var(--mut);font-size:12.5px}
.qbox{display:flex;align-items:center;gap:6px}
.qb{width:40px;height:40px;border-radius:10px;border:0;font-size:22px;font-weight:700;background:#e8e5da;color:var(--tx)}
.qb.p{background:var(--g);color:#fff}
.stock{min-width:64px;text-align:center;font-weight:700;font-size:15px;line-height:1.1}
.stock small{display:block;font-weight:500;font-size:11px;color:var(--mut)}
.low{color:var(--red)}
.sum{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;text-align:center}
.sum div{background:#f6f5ef;border-radius:10px;padding:8px 4px}
.sum b{display:block;font-size:17px}
.sum small{font-size:11.5px;color:var(--mut)}
.giveit{flex-wrap:wrap}
.giveit .qin{width:70px;text-align:center;padding:8px 4px;font-weight:700}
.lt{font-size:12.5px;color:var(--g);font-weight:700;width:100%;text-align:right;margin-top:-2px}
.bar{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 58px);z-index:5;background:var(--g);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 -2px 8px rgba(0,0,0,.15)}
.bar b{font-size:19px}
.bar .btn{background:#fff;color:var(--g)}
.seg{display:flex;background:#e8e5da;border-radius:10px;padding:3px;margin-bottom:10px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:8px;font-size:14px;font-weight:600;color:var(--mut)}
.seg button.on{background:#fff;color:var(--g);box-shadow:0 1px 2px rgba(0,0,0,.1)}
details.month{background:#fff;border-radius:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.06);overflow:hidden}
details.month summary{padding:12px;font-weight:700;display:flex;justify-content:space-between;list-style:none}
details.month summary::-webkit-details-marker{display:none}
details.month summary::after{content:"▾";color:var(--mut);margin-left:8px}
details.month[open] summary::after{content:"▴"}
.mb{padding:0 12px 12px}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:12px;color:var(--mut);font-weight:600}
td.r,th.r{text-align:right}
h3{font-size:14px;color:var(--g);margin:14px 0 4px}
.dl{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.dl small{color:var(--mut)}
.mv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.mv .plus{color:var(--g);font-weight:700}.mv .minus{color:var(--red);font-weight:700}
.diff{font-size:12px;font-weight:700;width:100%;text-align:right}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#mbody{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
#mbody h2{margin:0 0 6px;font-size:18px}
.mact{display:flex;gap:8px;margin-top:16px}
.mact .btn{flex:1}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:20px;font-size:14px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none}
#toast.on{opacity:.95}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.li{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.li span{flex:1}
.note{font-size:13px;color:var(--mut);margin:4px 0 10px}
.big{font-size:22px;font-weight:800;color:var(--g)}
</style>
</head>
<body>
<header>
 <h1>🫙 Αποθήκη<span class="h1x"> Τροφίμων</span></h1>
 <div class="row"><div class="hv">Αξία αποθήκης<b id="hval">0 €</b></div><button id="hshare" data-act="stockPDF" aria-label="PDF αποθήκης">📤</button></div>
</header>
<div id="banner"></div><main id="main"></main>
<div id="barwrap"></div>
<nav id="nav">
 <button data-tab="stock" class="on"><span>📦</span>Αποθήκη</button>
 <button data-tab="give"><span>🤝</span>Δόσιμο</button>
 <button data-tab="hist"><span>📅</span>Ιστορικό</button>
 <button data-tab="count"><span>📋</span>Απογραφή</button>
 <button data-tab="set"><span>⚙️</span>Ρυθμίσεις</button>
</nav>
<div id="modal"><div id="mbody"></div></div>
<div id="toast"></div>
<input type="file" id="impfile" style="display:none">

<script>
"use strict";
const KEY='foodstore_v1';
const UNITS=[
 {k:'g',s:'γρ.',p:'γρ.',per:'κιλό',f:0.001,step:100},
 {k:'kg',s:'κιλό',p:'κιλά',step:1},
 {k:'jar',s:'βάζο',p:'βάζα',step:1},
 {k:'box',s:'κιβώτιο',p:'κιβώτια',step:1},
 {k:'pack',s:'πακέτο',p:'πακέτα',step:1},
 {k:'pcs',s:'τεμάχιο',p:'τεμ.',step:1},
 {k:'bag',s:'σακούλα',p:'σακούλες',step:1},
 {k:'bottle',s:'μπουκάλι',p:'μπουκάλια',step:1},
 {k:'lt',s:'λίτρο',p:'λίτρα',step:1}
];
const MONTHS=['Ιανουάριος','Φεβρουάριος','Μάρτιος','Απρίλιος','Μάιος','Ιούνιος','Ιούλιος','Αύγουστος','Σεπτέμβριος','Οκτώβριος','Νοέμβριος','Δεκέμβριος'];

const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=v=>{let s=String(v==null?'':v).replace(/[\s €]/g,'');if(!s)return 0;
 if(s.includes(',')){s=s.replace(/\./g,'').replace(',','.')}else if((s.match(/\./g)||[]).length>1){s=s.replace(/\./g,'')}
 const n=parseFloat(s);return isFinite(n)?n:0};
const fmtIn=n=>{n=Math.round((+n||0)*1000)/1000;return n?String(n).replace('.',','):''};
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/ς/g,'σ').trim();
const plural=(n,a,b)=>Math.abs(n)===1?a:b;
const r3=n=>Math.round(n*1000)/1000;
const fmtN=n=>(+n).toLocaleString('el-GR',{maximumFractionDigits:3});
const eur=n=>(+n||0).toLocaleString('el-GR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dGR=s=>{if(!s)return'';const[a,b,c]=s.split('-');return c+'/'+b+'/'+a};
const U=k=>UNITS.find(u=>u.k===k)||UNITS[5];
const uLbl=(it,q)=>{const u=U(it.unit);return Math.abs(q)===1?u.s:u.p};
const qtyTxt=(it,q)=>fmtN(q)+' '+uLbl(it,q);
const priceLbl=it=>{const u=U(it.unit);return eur(it.price)+' / '+(u.per||u.s)};
const val=(it,q)=>q*(+it.price||0)*(U(it.unit).f||1);

// ---------- data ----------
let S;
function seed(){
 const c=(n)=>({id:uid(),name:n});
 const cz=c('Ζυμαρικά'),cs=c('Σάλτσες'),cm=c('Μαρμελάδες'),cme=c('Μέλι');
 const it=(cat,name,unit,pack)=>({id:uid(),catId:cat.id,name,unit,pack:pack||'',price:0,stock:0,min:0});
 return {v:1,cats:[cz,cs,cm,cme],items:[
  it(cz,'Στριφτάρια','g'),it(cz,'Κουσκούς','g'),it(cz,'Χυλοπίτες','g'),
  it(cs,'Σάλτσα','jar'),
  it(cm,'Μαρμελάδα φράουλα','jar'),it(cm,'Μαρμελάδα σύκο','jar'),
  it(cme,'Μέλι','jar')
 ],people:[],deliveries:[],moves:[]};
}
function normalize(){
 ['cats','items','people','deliveries','moves'].forEach(k=>{if(!Array.isArray(S[k]))S[k]=[]});
 if(!S.created)S.created=Date.now();
 if(!S.biz||typeof S.biz!=='object')S.biz={};['name','phone','addr'].forEach(k=>{if(typeof S.biz[k]!=='string')S.biz[k]=''});
 S.cats=S.cats.filter(c=>c&&c.id);S.cats.forEach(c=>c.name=String(c.name||'Κατηγορία'));
 S.items=S.items.filter(i=>i&&i.id);
 S.items.forEach(i=>{i.name=String(i.name||'Χωρίς όνομα');if(!UNITS.some(u=>u.k===i.unit))i.unit='pcs';i.pack=String(i.pack||'');
  i.price=+i.price||0;i.stock=r3(+i.stock||0);i.min=+i.min||0;
  if(!S.cats.some(c=>c.id===i.catId)){let o=S.cats.find(c=>c.name==='Χωρίς κατηγορία');if(!o){o={id:uid(),name:'Χωρίς κατηγορία'};S.cats.push(o)}i.catId=o.id}});
 S.people=[...new Set(S.people.filter(p=>typeof p==='string'&&p.trim()).map(p=>p.trim()))];
 S.deliveries=S.deliveries.filter(d=>d&&Array.isArray(d.lines));
 S.deliveries.forEach(d=>{if(!d.id)d.id=uid();if(!d.ts)d.ts=Date.now();if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date||''))d.date=today();d.person=String(d.person||'—');d.note=String(d.note||'');
  d.lines.forEach(l=>{l.qty=+l.qty||0;l.price=+l.price||0;l.total=+l.total||0;if(!UNITS.some(u=>u.k===l.unit))l.unit='pcs'});d.total=Math.round(d.lines.reduce((s,l)=>s+l.total,0)*100)/100});
 S.moves=S.moves.filter(m=>m&&m.date);
 const ord=S.deliveries.slice().sort((a,b)=>a.ts-b.ts);let n=0;ord.forEach(d=>{if(d.no)n=Math.max(n,d.no)});ord.forEach(d=>{if(!d.no)d.no=++n});S.seq=Math.max(S.seq||0,n);
}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
 if(!S||typeof S!=='object'||!Array.isArray(S.cats))S=seed();
 normalize();save();
 try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Σφάλμα αποθήκευσης: '+e.message)}}
const item=id=>S.items.find(i=>i.id===id);
const cat=id=>S.cats.find(c=>c.id===id);
const sortName=(a,b)=>a.name.localeCompare(b.name,'el');
function catItems(cid,q){q=norm(q);const cn=norm((cat(cid)||{name:''}).name);
 return S.items.filter(i=>i.catId===cid&&(!q||norm(i.name).includes(q)||norm(i.pack).includes(q)||cn.includes(q))).sort(sortName)}
function stockValue(){return S.items.reduce((s,i)=>s+val(i,Math.max(0,i.stock)),0)}
function addMove(it,delta,type,note,date){S.moves.push({id:uid(),ts:Date.now(),date:date||today(),itemId:it.id,name:it.name,unit:it.unit,delta:r3(delta),type,note:note||''})}
function canonPerson(n){n=String(n||'').replace(/\s+/g,' ').trim();if(!n)return'';const all=S.people.concat(S.deliveries.map(d=>d.person));const f=all.find(p=>norm(p)===norm(n));return f||n}
function addPerson(n){n=canonPerson(n);if(n&&!S.people.some(p=>norm(p)===norm(n))){S.people.push(n);S.people.sort((a,b)=>a.localeCompare(b,'el'))}return n}
function allPeople(){const s=new Map();S.people.concat(S.deliveries.map(d=>d.person)).forEach(p=>{if(p&&!s.has(norm(p)))s.set(norm(p),p)});return[...s.values()].sort((a,b)=>a.localeCompare(b,'el'))}

// ---------- ui helpers ----------
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('on'),1800)}
function openModal(h){$('#mbody').innerHTML=h;$('#modal').classList.add('on');const f=$('#mbody [autofocus]');if(f)setTimeout(()=>f.focus(),80)}
function closeModal(){$('#modal').classList.remove('on');$('#mbody').innerHTML=''}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function hdr(){$('#hval').textContent=eur(stockValue())}

let TAB='stock',search='',histSeg='del',histPerson='',cart={},giveInfo={person:'',date:today(),note:''};
function go(t){TAB=t;search='';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));render();window.scrollTo(0,0)}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.tab)});
function render(){hdr();rBanner();$('#barwrap').innerHTML='';({stock:rStock,give:rGive,hist:rHist,count:rCount,set:rSet})[TAB]()}

// ---------- BACKUP REMINDER ----------
const DAY=86400000;
function backupDue(){const last=S.lastBackup||S.created||Date.now();return Date.now()-last>=7*DAY&&!(S.snoozeUntil&&Date.now()<S.snoozeUntil)}
function rBanner(){const b=$('#banner');if(!backupDue()){b.innerHTML='';return}
 const days=Math.floor((Date.now()-(S.lastBackup||S.created))/DAY);
 b.innerHTML=`<div class="card"><b>💾 Ώρα για αντίγραφο ασφαλείας</b><div class="note">${S.lastBackup?'Το τελευταίο έγινε πριν από '+days+' ημέρες.':'Δεν έχεις κάνει ακόμη αντίγραφο.'} Κράτα το στο Drive, στο email ή στο Viber σου.</div>
 <div class="row"><button class="btn sp" data-act="exp">⬇ Εξαγωγή τώρα</button><button class="btn sec" data-act="snooze">Αύριο</button></div></div>`}
function backupDone(){S.lastBackup=Date.now();S.snoozeUntil=0;save();rBanner();if(TAB==='set')rSet()}
function ago(ts){if(!ts)return'ποτέ';const d=Math.floor((Date.now()-ts)/DAY);const dt=new Date(ts);return dGR(dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0'))+(d===0?' (σήμερα)':d===1?' (χθες)':' (πριν '+d+' ημέρες)')}

// ---------- PDF ----------
const PW=1190,PH=1684,PSC=1.4,PM=64;
const PC={g:'#2f5d3a',gl:'#e8f0e9',tx:'#1f2420',mut:'#6b716c',line:'#dcd9cf',zeb:'#f7f6f1',red:'#c0392b',hd:'#eef2ee'};
const PF='-apple-system,"Helvetica Neue",Helvetica,Arial,sans-serif';
function pfit(x,s,max){s=String(s);if(x.measureText(s).width<=max)return s;while(s.length>1&&x.measureText(s+'…').width>max)s=s.slice(0,-1);return s+'…'}
function ptxt(x,s,X,Y,o){o=o||{};x.font=(o.b?'700 ':'400 ')+(o.s||20)+'px '+PF;x.fillStyle=o.c||PC.tx;x.textAlign=o.al||'left';x.textBaseline='alphabetic';x.fillText(o.max?pfit(x,s,o.max):s,X,Y)}
function prr(x,X,Y,w,h,r,fill){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();x.fillStyle=fill;x.fill()}
const MC=document.createElement('canvas').getContext('2d');
function Rec(){const ops=[],r={ops};
 ['font','fillStyle','textAlign','textBaseline'].forEach(pn=>Object.defineProperty(r,pn,{set(v){ops.push([0,pn,v]);MC[pn]=v},get(){return MC[pn]}}));
 ['fillText','fillRect','beginPath','moveTo','arcTo','closePath','fill'].forEach(m=>r[m]=(...a)=>ops.push([1,m,a]));
 r.measureText=s=>MC.measureText(s);return r}
let RC=null;
function renderPage(rec){if(!RC){RC=document.createElement('canvas');RC.width=Math.round(PW*PSC);RC.height=Math.round(PH*PSC)}
 const x=RC.getContext('2d');x.setTransform(1,0,0,1,0,0);x.fillStyle='#fff';x.fillRect(0,0,RC.width,RC.height);x.setTransform(PSC,0,0,PSC,0,0);
 rec.ops.forEach(o=>{if(o[0]===0)x[o[1]]=o[2];else x[o[1]](...o[2])});
 const url=RC.toDataURL('image/jpeg',0.9),bin=atob(url.split(',')[1]),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);
 return{b:a,w:RC.width,h:RC.height,url}}
function nowTxt(){const d=new Date();return dGR(today())+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function PDoc(title,subtitle){
 const d={pages:[],title,subtitle,biz:S.biz||{}};
 const bizName=()=>d.biz.name||'Αποθήκη Τροφίμων';
 d.add=()=>{const x=Rec();d.pages.push(x);d.x=x;
  if(d.pages.length===1){x.fillStyle=PC.g;x.fillRect(0,0,PW,160);
   let fs=36;x.font='700 36px '+PF;while(fs>24&&x.measureText(bizName()).width>650){fs-=2;x.font='700 '+fs+'px '+PF}
   ptxt(x,bizName(),PM,72,{s:fs,b:1,c:'#fff',max:650});
   const sub=[d.biz.phone,d.biz.addr].filter(Boolean).join('   ·   ');if(sub)ptxt(x,sub,PM,112,{s:20,c:'#d5e3d8',max:650});
   ptxt(x,d.title,PW-PM,72,{s:32,b:1,c:'#fff',al:'right',max:380});
   ptxt(x,d.subtitle||'',PW-PM,112,{s:21,c:'#d5e3d8',al:'right',max:380});
   d.y=204}

function pdfBlob(imgs){
 const enc=new TextEncoder(),parts=[],offs=[];let len=0;
 const push=b=>{if(typeof b==='string')b=enc.encode(b);parts.push(b);len+=b.length};
 const obj=(i,s)=>{offs[i]=len;push(i+' 0 obj\n'+s)};
 const n=imgs.length,tot=2+3*n;
 push('%PDF-1.4\n%âãÏÓ\n');
 obj(1,'<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
 obj(2,'<< /Type /Pages /Kids ['+imgs.map((_,i)=>(3+3*i)+' 0 R').join(' ')+'] /Count '+n+' >>\nendobj\n');
 imgs.forEach((im,i)=>{const p=3+3*i,cs='q 595.28 0 0 841.89 0 0 cm /Im'+i+' Do Q';
  obj(p,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im'+i+' '+(p+2)+' 0 R >> >> /Contents '+(p+1)+' 0 R >>\nendobj\n');
  obj(p+1,'<< /Length '+cs.length+' >>\nstream\n'+cs+'\nendstream\nendobj\n');
  obj(p+2,'<< /Type /XObject /Subtype /Image /Width '+im.w+' /Height '+im.h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+im.b.length+' >>\nstream\n');push(im.b);push('\nendstream\nendobj\n')});
 const xr=len;let x='xref\n0 '+(tot+1)+'\n0000000000 65535 f \n';for(let i=1;i<=tot;i++)x+=String(offs[i]).padStart(10,'0')+' 00000 n \n';
 push(x+'trailer\n<< /Size '+(tot+1)+' /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF\n');
 return new Blob(parts,{type:'application/pdf'});
}
let curPDF=null;
const fileSafe=s=>String(s).replace(/[\\/:*?"<>|]+/g,'').replace(/\s+/g,'_');
function showPDF(doc,fname){
 toast('Δημιουργία PDF…');
 setTimeout(()=>{
  let pages;try{pages=doc.finish().map(renderPage)}catch(e){alert('Δεν δημιουργήθηκε το PDF: '+e.message);return}
  const blob=pdfBlob(pages);
  if(curPDF&&curPDF.url)URL.revokeObjectURL(curPDF.url);
  curPDF={blob,name:fileSafe(fname)+'.pdf',url:URL.createObjectURL(blob)};
  openModal(`<h2>📄 ${esc(curPDF.name)}</h2><div class="note">${pages.length} ${pages.length===1?'σελίδα':'σελίδες'}</div>
  <div style="max-height:52vh;overflow:auto;background:#e8e5da;border-radius:10px;padding:8px">${pages.map(pg=>`<img src="${pg.url}" style="width:100%;display:block;margin-bottom:8px;box-shadow:0 1px 4px rgba(0,0,0,.2)">`).join('')}</div>
  <div class="mact"><button class="btn sec" onclick="closeModal()">Κλείσιμο</button><button class="btn sec" data-act="openPDF">Άνοιγμα</button><button class="btn" data-act="sharePDF">📤 Αποστολή</button></div>`);
 },30);
}
function sharePDF(){if(!curPDF)return;
 try{const f=new File([curPDF.blob],curPDF.name,{type:'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f]}).catch(()=>{});return}}catch(e){}

  const date=$('#aD').value||today(),r=$('#aR').value;

function cartLines(){return Object.entries(cart).map(([id,q])=>({it:item(id),q})).filter(l=>l.it&&l.q>0)}
function cartTotal(){return cartLines().reduce((s,l)=>s+val(l.it,l.q),0)}
function rGive(){
 if(!cartLines().length&&!giveInfo.person&&!giveInfo.dateSet)giveInfo.date=today();
 $('#main').innerHTML=`
 <div class="card">
  <label style="margin-top:0">Σε ποιον δίνεις;</label>
  <input id="gP" list="plist2" placeholder="π.χ. Μπάμπης" value="${esc(giveInfo.person)}"><datalist id="plist2">${S.people.map(p=>`<option value="${esc(p)}">`).join('')}</datalist>
  <div class="row"><div class="sp"><label>Ημερομηνία</label><input type="date" id="gD" value="${giveInfo.date}"></div>
  <div class="sp"><label>Σημείωση</label><input id="gN" value="${esc(giveInfo.note)}" placeholder="προαιρετικό"></div></div>
 </div>
 <input class="search" id="gq" placeholder="🔍 Αναζήτηση είδους..." value="${esc(search)}">
 <div id="glist"></div><div style="height:80px"></div>`;
 $('#gP').oninput=e=>giveInfo.person=e.target.value;
 $('#gD').onchange=e=>{giveInfo.date=e.target.value;giveInfo.dateSet=true};
 $('#gN').oninput=e=>giveInfo.note=e.target.value;
 $('#gq').oninput=e=>{search=e.target.value;rGiveList()};
 rGiveList();
 $('#barwrap').innerHTML=`<div class="bar"><div class="sp"><small id="gCnt"></small><br><b id="gTot"></b></div><button class="btn sec sm" data-act="clearCart" style="background:rgba(255,255,255,.2);color:#fff">Καθαρισμός</button><button class="btn" data-act="finishGive">Ολοκλήρωση ✓</button></div>`;
 updBar();
}
function rGiveList(){
 let h='';
 S.cats.forEach(c=>{const its=catItems(c.id,search);if(!its.length)return;
  h+=`<div class="cat"><div class="cath"><span>${esc(c.name)}</span></div>`;
  its.forEach(i=>{const q=cart[i.id]||0;
   h+=`<div class="item giveit"><div class="info"><b>${esc(i.name)}</b><small>Υπάρχουν ${qtyTxt(i,i.stock)} · ${priceLbl(i)}</small></div>
   <div class="qbox"><button class="qb" data-act="cm" data-id="${i.id}">−</button><input class="qin" data-id="${i.id}" inputmode="decimal" value="${fmtIn(q)}" placeholder="0"><button class="qb p" data-act="cp" data-id="${i.id}">+</button></div>
   <div class="lt" id="lt_${i.id}">${q?qtyTxt(i,q)+' = '+eur(val(i,q)):''}</div></div>`});
  h+='</div>'});
 if(!h)h='<div class="empty">Δεν υπάρχουν είδη. Πρόσθεσε από την «Αποθήκη».</div>';
 $('#glist').innerHTML=h;
 document.querySelectorAll('.qin').forEach(inp=>inp.oninput=()=>{setCart(inp.dataset.id,num(inp.value),false)});
}
function setCart(id,q,rewrite){const i=item(id);q=Math.max(0,r3(q));if(q)cart[id]=q;else delete cart[id];
 if(rewrite){const inp=document.querySelector('.qin[data-id="'+id+'"]');if(inp)inp.value=fmtIn(q)}
 const lt=$('#lt_'+id);if(lt){const over=q>i.stock;lt.innerHTML=q?(over?'<span class="low">⚠ περισσότερα από όσα υπάρχουν · </span>':'')+qtyTxt(i,q)+' = '+eur(val(i,q)):''}
 updBar()}
function updBar(){const ls=cartLines();if(!$('#gTot'))return;$('#gTot').textContent=eur(cartTotal());$('#gCnt').textContent=ls.length?ls.length+' '+plural(ls.length,'είδος','είδη'):'Δεν έχεις διαλέξει τίποτα'}

function saveDelivery(person,date,note,lines){
 person=addPerson(person);
 S.seq=(S.seq||0)+1;
 const d={id:uid(),no:S.seq,ts:Date.now(),date,person,note,lines:lines.map(l=>({itemId:l.it.id,name:l.it.name,unit:l.it.unit,qty:r3(l.q),price:l.it.price,total:Math.round(val(l.it,l.q)*100)/100}))};
 d.total=Math.round(d.lines.reduce((s,l)=>s+l.total,0)*100)/100;
 lines.forEach(l=>{l.it.stock=r3(l.it.stock-l.q);addMove(l.it,-l.q,'Δόθηκε',person,date)});
 S.deliveries.push(d);save();return d;
}
function finishGive(){

 const over=ls.filter(l=>l.q>l.it.stock);
 openModal(`<h2>Επιβεβαίωση</h2><div class="note">Σε: <b>${esc(canonPerson(per))}</b> · ${dGR(giveInfo.date||today())}</div>
 <table><tr><th>Είδος</th><th class="r">Ποσ.</th><th class="r">€</th></tr>
 ${ls.map(l=>`<tr><td>${esc(l.it.name)}</td><td class="r">${qtyTxt(l.it,l.q)}</td><td class="r">${eur(val(l.it,l.q))}</td></tr>`).join('')}
 <tr><td colspan="2"><b>ΣΥΝΟΛΟ</b></td><td class="r big">${eur(cartTotal())}</td></tr></table>
 ${over.length?`<div class="note low">⚠ Δεν φτάνει το απόθεμα για: ${over.map(l=>esc(l.it.name)).join(', ')}. Θα βγει αρνητικό.</div>`:''}
 <div class="mact"><button class="btn sec" onclick="closeModal()">Πίσω</button><button class="btn" id="cOk">Καταχώρηση</button></div>`);
 $('#cOk').onclick=()=>{if($('#cOk').disabled)return;$('#cOk').disabled=true;const d=saveDelivery(per,giveInfo.date||today(),giveInfo.note,ls);cart={};giveInfo={person:'',date:today(),note:''};search='';render();showDelivery(d,true)};
}

 <table><tr><th>Είδος</th><th class="r">Ποσ.</th><th class="r">Τιμή</th><th class="r">€</th></tr>
 ${d.lines.map(l=>{const u=U(l.unit);return `<tr><td>${esc(l.name)}</td><td class="r">${fmtN(l.qty)} ${Math.abs(l.qty)===1?u.s:u.p}</td><td class="r">${eur(l.price)}/${u.per||u.s}</td><td class="r">${eur(l.total)}</td></tr>`}).join('')}
 <tr><td colspan="3"><b>ΣΥΝΟΛΟ</b></td><td class="r big">${eur(d.total)}</td></tr></table>
 <div class="mact">${fresh?'':'<button class="btn red" id="dDel">Ακύρωση</button>'}<button class="btn blue" id="dSh">📄 PDF</button><button class="btn sec" onclick="closeModal()">Κλείσιμο</button></div>
 ${fresh?'':'<div class="note">«Ακύρωση» σβήνει την παράδοση και επιστρέφει τα είδη στην αποθήκη.</div>'}`);
 $('#dSh').onclick=()=>delPDF(d);

  d.lines.forEach(l=>{const it=item(l.itemId);if(it){it.stock=r3(it.stock+l.qty);addMove(it,l.qty,'Ακύρωση παράδοσης',d.person)}});

// ---------- HISTORY ----------
function rHist(){
 if(histPerson&&!allPeople().includes(histPerson))histPerson='';
 const dels=S.deliveries.filter(d=>!histPerson||d.person===histPerson).sort((a,b)=>(b.date+b.ts).localeCompare(a.date+a.ts));
 const all=dels.reduce((s,d)=>s+d.total,0);
 let h=`<div class="seg"><button data-act="hseg" data-s="del" class="${histSeg==='del'?'on':''}">Παραδόσεις</button><button data-act="hseg" data-s="mv" class="${histSeg==='mv'?'on':''}">Όλες οι κινήσεις</button></div>`;
 if(histSeg==='mv'){
  const mv=S.moves.slice().sort((a,b)=>(b.date+b.ts).localeCompare(a.date+a.ts)).slice(0,400);
  h+='<div class="card">'+(mv.length?mv.map(m=>`<div class="mv"><div><b>${esc(m.name)}</b><br><small style="color:var(--mut)">${dGR(m.date)} · ${esc(m.type)}${m.note?' · '+esc(m.note):''}</small></div><div class="${m.delta>0?'plus':'minus'}">${m.delta>0?'+':''}${fmtN(m.delta)} ${U(m.unit).p}</div></div>`).join(''):'<div class="empty">Καμία κίνηση ακόμη.</div>')+'</div>';
  $('#main').innerHTML=h;return}
 h+=`<select id="hP" style="margin-bottom:10px"><option value="">Όλα τα άτομα</option>${allPeople().map(p=>`<option value="${esc(p)}" ${p===histPerson?'selected':''}>${esc(p)}</option>`).join('')}</select>
 <div class="card row"><div class="sp"><small style="color:var(--mut)">Σύνολο μέχρι σήμερα${histPerson?' — '+esc(histPerson):''}</small><div class="big">${eur(all)}</div></div><div style="text-align:right"><b>${dels.length}</b><br><small style="color:var(--mut)">παραδόσεις</small></div></div>`;
 const yrs=[...new Set(dels.map(d=>d.date.slice(0,4)))].sort().reverse();
 if(dels.length)h+=`<div class="card"><b>Συγκεντρωτικά PDF</b>${histPerson?'<div class="note">Μόνο για: '+esc(histPerson)+'</div>':''}
  <div class="row" style="margin-top:8px"><select id="hY" style="width:110px">${yrs.map(y=>`<option>${y}</option>`).join('')}</select><button class="btn blue sp" data-act="yearPDF">📄 PDF έτους</button></div>
  <button class="btn blue full" style="margin-top:8px" data-act="allPDF">📄 PDF όλων μέχρι σήμερα</button></div>`;
 if(!dels.length)h+='<div class="empty">Δεν έχεις δώσει τίποτα ακόμη.<br>Πήγαινε στο «Δόσιμο».</div>';
 const byM={};dels.forEach(d=>{const k=d.date.slice(0,7);(byM[k]=byM[k]||[]).push(d)});
 Object.keys(byM).sort().reverse().forEach((k,idx)=>{const ds=byM[k];const tot=ds.reduce((s,d)=>s+d.total,0);const[y,m]=k.split('-');
  const pi={},pp={};
  ds.forEach(d=>{pp[d.person]=(pp[d.person]||0)+d.total;d.lines.forEach(l=>{const kk=l.name+'|'+l.unit;const o=pi[kk]=pi[kk]||{name:l.name,unit:l.unit,q:0,t:0};o.q+=l.qty;o.t+=l.total})});
  h+=`<details class="month" ${idx===0?'open':''}><summary><span>${MONTHS[+m-1]} ${y}</span><span>${eur(tot)} · ${ds.length}</span></summary><div class="mb">
  <h3>Ανά είδος</h3><table>${Object.values(pi).sort((a,b)=>b.t-a.t).map(o=>`<tr><td>${esc(o.name)}</td><td class="r">${fmtN(r3(o.q))} ${U(o.unit).p}</td><td class="r">${eur(o.t)}</td></tr>`).join('')}</table>
  ${histPerson?'':`<h3>Ανά άτομο</h3><table>${Object.entries(pp).sort((a,b)=>b[1]-a[1]).map(([p,t])=>`<tr><td>${esc(p)}</td><td class="r">${eur(t)}</td></tr>`).join('')}</table>`}
  <h3>Παραδόσεις</h3>${ds.map(d=>`<div class="dl" data-act="showDel" data-id="${d.id}"><div><b>${esc(d.person)}</b><br><small>${dGR(d.date)} · ${d.lines.length} ${plural(d.lines.length,'είδος','είδη')}${d.note?' · '+esc(d.note):''}</small></div><b>${eur(d.total)} ›</b></div>`).join('')}
  <button class="btn sec sm" style="margin-top:10px" data-act="shareMonth" data-k="${k}">📄 PDF μήνα</button>
  </div></details>`});
 $('#main').innerHTML=h;
 const hp=$('#hP');if(hp)hp.onchange=e=>{histPerson=e.target.value;rHist()};
}

let countVals={};
function rCount(){
 let h=`<div class="card"><b>Απογραφή αποθήκης</b><div class="note">Γράψε πόσα μέτρησες σε κάθε είδος. Όσα αφήσεις κενά δεν αλλάζουν. Με «Αποθήκευση» διορθώνεται το απόθεμα και γράφεται στις κινήσεις.</div>
 <button class="btn blue full" data-act="stockPDF">📄 PDF αποθήκης</button></div>`;
 S.cats.forEach(c=>{const its=catItems(c.id,'');if(!its.length)return;
  h+=`<div class="cat"><div class="cath"><span>${esc(c.name)}</span></div>`;
  its.forEach(i=>{const v=countVals[i.id];
   h+=`<div class="item giveit"><div class="info"><b>${esc(i.name)}</b><small>Στο σύστημα: ${qtyTxt(i,i.stock)}</small></div>
   <input class="qin cin" data-id="${i.id}" inputmode="decimal" value="${v!=null?esc(v):''}" placeholder="μέτρησα" style="width:96px"><span style="font-size:12px;color:var(--mut);width:52px">${U(i.unit).p}</span>
   <div class="diff" id="df_${i.id}"></div></div>`});
  h+='</div>'});
 h+=`<button class="btn full" data-act="saveCount">Αποθήκευση απογραφής</button>`;
 $('#main').innerHTML=h;
 document.querySelectorAll('.cin').forEach(inp=>{const f=()=>{const id=inp.dataset.id,i=item(id);if(inp.value.trim()===''){delete countVals[id];$('#df_'+id).textContent='';return}
  countVals[id]=inp.value;const d=r3(num(inp.value)-i.stock);const e=$('#df_'+id);e.textContent=d===0?'✓ σωστό':(d>0?'+':'')+fmtN(d)+' '+U(i.unit).p+' ('+(d>0?'+':'')+eur(val(i,d))+')';e.style.color=d===0?'var(--g)':d>0?'var(--blue)':'var(--red)'};inp.oninput=f;f()});
}
function saveCount(){const ids=Object.keys(countVals).filter(id=>item(id));if(!ids.length){alert('Δεν έγραψες καμία μέτρηση');return}
 const nch=ids.filter(id=>r3(num(countVals[id]))!==item(id).stock).length;
 if(nch&&!confirm('Θα διορθωθεί το απόθεμα σε '+nch+' '+plural(nch,'είδος','είδη')+'. Συνέχεια;'))return;
 let ch=0;ids.forEach(id=>{const i=item(id),n=r3(num(countVals[id])),d=r3(n-i.stock);if(d!==0){i.stock=n;addMove(i,d,'Απογραφή');ch++}});
 save();countVals={};render();toast(ch?'Διορθώθηκαν '+ch+' είδη':'Όλα σωστά ✓')}

function exportData(){const txt=JSON.stringify(S,null,1);const name='apothiki-'+today()+'.json';
 try{const f=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:name}).then(()=>{backupDone();toast('Το αντίγραφο στάλθηκε ✓')}).catch(()=>{});return}}catch(e){}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();backupDone();toast('Αποθηκεύτηκε '+name)}
$('#impfile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{let d;try{d=JSON.parse(r.result)}catch(x){d=null}e.target.value='';
  if(!d||!Array.isArray(d.cats)||!Array.isArray(d.items)){alert('Αυτό το αρχείο δεν είναι αντίγραφο της Αποθήκης.');return}
  if(!confirm('Επαναφορά από αντίγραφο:\n'+d.items.length+' είδη, '+((d.deliveries||[]).length)+' παραδόσεις.\n\nΤα τωρινά δεδομένα θα αντικατασταθούν. Συνέχεια;'))return;
  S=d;normalize();S.lastBackup=Date.now();S.snoozeUntil=0;save();cart={};countVals={};histPerson='';render();toast('Έγινε επαναφορά ✓')};
 r.onerror=()=>alert('Δεν διαβάστηκε το αρχείο');r.readAsText(f)};

// ---------- actions ----------
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id;
 if(el.tagName==='A')e.preventDefault();
 switch(a){
  case'newItem':itemForm(null,el.dataset.cat);break;
  case'editItem':itemForm(item(id));break;
  case'adj':adjForm(item(id),el.dataset.mode);break;
  case'cp':{const i=item(id);setCart(id,(cart[id]||0)+U(i.unit).step,true);break}
  case'cm':{const i=item(id);setCart(id,(cart[id]||0)-U(i.unit).step,true);break}
  case'clearCart':if(cartLines().length&&confirm('Καθαρισμός επιλογών;')){cart={};rGive()}break;
  case'finishGive':finishGive();break;
  case'hseg':histSeg=el.dataset.s;rHist();break;
  case'showDel':showDelivery(S.deliveries.find(d=>d.id===id));break;
  case'shareMonth':periodPDF('m',el.dataset.k);break;
  case'yearPDF':periodPDF('y',$('#hY').value);break;
  case'allPDF':periodPDF('all');break;
  case'saveCount':saveCount();break;
  case'stockPDF':stockPDF();break;
  case'sharePDF':sharePDF();break;
  case'openPDF':openPDF();break;
  case'cAdd':{const n=prompt('Όνομα νέας κατηγορίας:');if(n&&n.trim()){S.cats.push({id:uid(),name:n.trim()});save();render()}break}
  case'cRen':{const c=cat(id),n=prompt('Νέο όνομα:',c.name);if(n&&n.trim()){c.name=n.trim();save();render()}break}
  case'cUp':{const ix=S.cats.findIndex(c=>c.id===id);if(ix>0){[S.cats[ix-1],S.cats[ix]]=[S.cats[ix],S.cats[ix-1]];save();render()}break}
  case'cDel':{const c=cat(id);if(S.items.some(i=>i.catId===id)){alert('Η κατηγορία «'+c.name+'» έχει είδη. Μετέφερε ή διέγραψέ τα πρώτα.');break}if(confirm('Διαγραφή κατηγορίας «'+c.name+'»;')){S.cats=S.cats.filter(x=>x.id!==id);save();render()}break}
  case'pAdd':{const n=prompt('Όνομα:');if(n){addPerson(n);save();render()}break}
  case'pDel':{const ix=+el.dataset.ix;if(confirm('Διαγραφή «'+S.people[ix]+'» από τη λίστα; (Το ιστορικό μένει)')){S.people.splice(ix,1);save();render()}break}
  case'exp':exportData();break;
  case'snooze':S.snoozeUntil=Date.now()+DAY;save();rBanner();toast('Θα σου το θυμίσω αύριο');break;
  case'imp':$('#impfile').click();break;
  case'wipe':if(confirm('Θα σβηστούν ΟΛΑ (είδη, ιστορικό, άτομα). Σίγουρα;')&&confirm('Τελευταία επιβεβαίωση: διαγραφή όλων;')){S=seed();normalize();save();cart={};countVals={};histPerson='';giveInfo={person:'',date:today(),note:''};render();toast('Διαγράφηκαν')}break;
 }});

load();render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));
</script>
</body>
</html>
